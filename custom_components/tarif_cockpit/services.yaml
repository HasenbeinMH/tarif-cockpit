set_abschlag:
  fields:
    zaehler:
      required: true
      selector:
        device:
          integration: tarif_cockpit
    ab:
      required: true
      selector:
        date:
    betrag:
      required: true
      selector:
        number:
          min: 0
          max: 100000
          step: any
          mode: box
    zahltag:
      selector:
        number:
          min: 1
          max: 31
          step: 1
          mode: box
    rhythmus:
      selector:
        select:
          translation_key: rhythm
          options:
            - "1"
            - "2"
            - "3"
