      required: true
      selector:
        number:
          min: 0
          max: 100000
          step: any
          mode: box
    art:
      default: one_off
      selector:
        select:
          translation_key: payment_type
          options:
            - advance
            - one_off
            - credit
            - final
            - refund
    status:
      default: paid
      selector:
        select:
          translation_key: payment_status
          options:
            - paid
            - planned
            - cancelled
