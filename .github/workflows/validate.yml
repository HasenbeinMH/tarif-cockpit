name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  build:
    name: Karten-Build und Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build
        run: node tools/build.mjs
      - name: Eingecheckte Karten-Datei passt zu src/
        run: git diff --exit-code custom_components/tarif_cockpit/frontend/tarif-cockpit.js
      - name: Syntax
        run: node --check custom_components/tarif_cockpit/frontend/tarif-cockpit.js

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  marketplace:
    name: Marketplace/HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validierung
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  engine:
    name: Rechenkern (ohne Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pytest
      - run: python -m pytest tests/engine -q

  integration:
    name: Integration (HA ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Minimum
            requirements: requirements_test_min.txt
          - name: aktuell
            requirements: requirements_test.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - run: pip install -r ${{ matrix.requirements }}
      - run: python -m pytest tests -q
