<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Tarif-Cockpit: Tacho (Abschlag passt / knapp / Nachzahlung) mit Zeiger und Euro-Zeichen. Quelle für brand/*.png -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="244" fill="url(#face)"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#374151" stroke-width="8"/>
  <!-- Skala: grün (passt), gelb (knapp), rot (Nachzahlung); Bogen von 150° bis 30° über oben -->
  <g fill="none" stroke-width="44" stroke-linecap="butt">
    <path d="M 82.8 356 A 200 200 0 0 1 379.4 98.5" stroke="#22c55e"/>
    <path d="M 385.6 103.6 A 200 200 0 0 1 418.6 155" stroke="#f59e0b"/>
    <path d="M 422 162 A 200 200 0 0 1 429.2 356" stroke="#ef4444"/>
  </g>
  <!-- Teilstriche -->
  <g stroke="#e5e7eb" stroke-width="8" stroke-linecap="round">
    <line x1="256" y1="96" x2="256" y2="128"/>
    <line x1="142.9" y1="142.9" x2="165.5" y2="165.5"/>
    <line x1="369.1" y1="142.9" x2="346.5" y2="165.5"/>
  </g>
  <!-- Euro-Zeichen -->
  <text x="256" y="402" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="112" fill="#f9fafb">€</text>
  <!-- Zeiger (steht im grünen Bereich) -->
  <g transform="rotate(-28 256 268)">
    <path d="M 244 268 L 256 120 L 268 268 Z" fill="#f97316"/>
  </g>
  <circle cx="256" cy="268" r="30" fill="#f97316"/>
  <circle cx="256" cy="268" r="12" fill="#111827"/>
</svg>
